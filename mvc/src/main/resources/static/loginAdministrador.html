<!doctype html>
<html lang="es">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Ingreso a la aplicación - Administradores</title>
	<style>
		:root {
			--blue: #173f8a;
			--blue-2: #1b4aa0;
			--muted: #7a7a7a
		}

		html,
		body {
			height: 100%;
			margin: 0;
			font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial
		}

		body {
			display: flex;
			align-items: center;
			justify-content: center;
			background: #f5f7fb;
			padding: 24px
		}

		.card {
			background: #fff;
			width: 100%;
			max-width: 420px;
			border-radius: 12px;
			padding: 28px;
			box-shadow: 0 8px 28px rgba(25, 39, 70, 0.08)
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 12px;
			margin-bottom: 6px
		}

		.logo {
			width: 44px;
			height: 44px;
			border-radius: 10px;
			background: linear-gradient(135deg, var(--blue), var(--blue-2))
		}

		h1 {
			font-size: 20px;
			margin: 0;
			color: #0e2340
		}

		p.sub {
			margin: 6px 0 18px;
			color: var(--muted);
			font-size: 13px
		}

		label {
			display: block;
			font-weight: 600;
			color: #17223a;
			margin-bottom: 8px;
			font-size: 13px
		}

		.field {
			margin-bottom: 14px
		}

		input[type=text],
		input[type=password] {
			width: 100%;
			Padding: 12px 14px;
			border-radius: 8px;
			border: 1px solid #e1e6f0;
			background: #fbfdff;
			font-size: 14px;
			box-sizing: border-box
		}

		input::placeholder {
			color: #b9c2d6
		}

		.helper {
			font-size: 12px;
			color: #9aa3b6;
			margin-top: 6px
		}

		.btn {
			display: inline-block;
			width: 100%;
			text-align: center;
			background: var(--blue);
			color: #fff;
			padding: 12px;
			border-radius: 8px;
			border: none;
			font-weight: 700;
			cursor: pointer;
			margin-top: 8px;
			box-shadow: 0 4px 12px rgba(23, 63, 138, 0.12)
		}

		.btn:active {
			transform: translateY(1px)
		}

		.footer {
			margin-top: 18px;
			text-align: center;
			color: #a3aab8;
			font-size: 13px
		}

		@media (max-width:420px) {
			body {
				padding: 16px
			}

			.card {
				padding: 18px
			}
		}
	</style>
</head>

<body>
	<main class="card" role="main">
		<div class="brand">
			<div class="logo" aria-hidden="true"></div>
			<div>
				<h1>Ingreso a la aplicación</h1>
				<p class="sub">Por favor ingrese con su cédula de identidad y contraseña.</p>
			</div>
		</div>

		<form id="loginForm" action="/LoginController/loginAdministrador" method="post" onsubmit="acceder(event);">

			<div class="field">
				<label for="cedula">Cédula de identidad</label>
				<input id="cedula" name="ci" type="text" inputmode="numeric" pattern="\d*" placeholder="Ej: 41234567"
					required />

				<div class="helper">Solo números, sin puntos ni guiones.</div>
			</div>

			<div class="field">
				<label for="password">Contraseña</label>
				<input id="password" name="contrasenia" type="password" placeholder="Ingrese su contraseña"
					autocomplete="current-password" required />
			</div>

			<button type="submit" class="btn">Ingresar</button>
		</form>

		<div id="resultado"></div>

		<p class="error" id="errorMsg" role="alert"></p>

		<div class="footer">©️ 2025 – Acceso de administradores</div>
	</main>

	<script src="vistaWeb.js"></script>
	<script src="utilesVista.js"></script>

	<script>

		function acceder(event) {
			event.preventDefault();
			submit("LoginController/loginAdministrador", serializarFormulario("loginForm"));
		}

		function mostrar_loginExitoso(urlDestino) {
			window.location.href = urlDestino;
		}

		async function mostrar_error(mensaje) {
			await mostrarMensaje(mensaje);
		}

		async function mostrar_adminYaLogueado() {
			await mostrarMensaje("Ud. Ya está logueado");
			window.location.href = "menuAdministrador.html";
		}

		async function excepcionDeAplicacion(text) {
			await mostrarMensaje(text);
		}

	</script>

</body>

</html>
