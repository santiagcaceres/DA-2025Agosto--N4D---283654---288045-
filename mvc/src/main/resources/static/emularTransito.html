<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emular tránsito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 24px;
            background: #f8f9fa
        }

        .card-shadow {
            box-shadow: 0 2px 6px rgba(0, 0, 0, .08)
        }

        .tarifas-table td,
        .tarifas-table th {
            vertical-align: middle
        }

        .result-box {
            white-space: pre-line
        }

        .muted-small {
            font-size: .9rem;
            color: #6c757d
        }
    </style>
</head>

<body>

    <script src="vistaWeb.js"></script>
    <script src="utilesVista.js"></script>

    <div class="container">
        <h3 class="mb-4">Emular tránsito</h3>

        <div class="row g-4">
            <div class="col-lg-7">
                <div class="card card-shadow">
                    <div class="card-body">
                        <form id="emularForm" action="/transito/emularTransito" method="post"
                            onsubmit="emularTransito(event);">

                            <div class="mb-3">
                                <label for="puestoSelect" class="form-label">Puesto</label>
                                <select id="puestoSelect" name="puesto" class="form-select" onchange="cargarTarifas()">
                                    <option value="">Seleccione un puesto...</option>
                                </select>
                            </div>
<div id="DespuesDeCargar" hidden>
                            <div class="mb-3 row">
                                <div class="col-md-6">
                                    <label for="matricula" class="form-label">Matrícula</label>
                                    <input id="matricula" name="matricula" class="form-control"
                                        placeholder="Ej: ABC1234">
                                </div>
                                <!--<div class="col-md-6">
                                    <label for="categoria" class="form-label">Categoría (opcional)</label>
                                    <input id="categoria" name="categoria" class="form-control"
                                        placeholder="A, B, C..." />
                                </div>-->
                            </div>

                            <div class="mb-3 row" >
                                <div class="col-md-6">
                                    <label for="fechaHora" class="form-label">Fecha y hora del tránsito</label>
                                    <input id="fechaHora" name="fechaHora" type="datetime-local" class="form-control">
                                </div>
                                <div class="col-md-6 d-flex align-items-end">
                                    <button id="emularBtn" class="btn btn-primary w-100" type="submit">Emular
                                        tránsito</button>
                                </div>
                            </div>
</div>
                            <div class="muted-small">Ingrese los datos y presione <strong>Emular tránsito</strong>. Si
                                desea probar rápidamente, use los datos de ejemplo del selector.</div>
                        </form>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-body">
                        <h6>Resultado</h6>
                        <div id="resultado" class="result-box">Aún no se ha emulado ningún tránsito.</div>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card card-shadow">
                    <div class="card-body">
                        <h6>Tarifas del puesto</h6>
                        <div class="table-responsive">
                            <div id="tarifasTable"></div>
                        </div>
                        <div class="muted-small">Se muestran categorías y montos actuales del puesto seleccionado.</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>

        urlIniciarVista = "/transito/vistaConectada";

        function mostrar_PuestosPeaje(puestos) {
            console.log("Mostrando puestos: ", puestos);
            document.getElementById("puestoSelect").innerHTML = crearListaDesdeJson({
                data: puestos,
                id: "puestoSelect",
                campoMostrar: "nombre",   
                campoValor: "nombre",     
                mostrarOpcionInicial: true 
            });
        }

        function emularTransito(event) {
            event.preventDefault();
            submit("/transito/emularTransito", serializarFormulario("emularForm"));
        }

        function cargarTarifas() {
            const puesto = document.getElementById("puestoSelect").value;

            if (!puesto) {
                document.getElementById("tarifasTable").innerHTML = '<div class="text-muted">Seleccione un puesto para ver tarifas</div>';
                return;
            }

            // El controlador espera GET con param=<nombrePuesto>
            submit('/transito/tarifasDePuesto', 'param=' + encodeURIComponent(puesto), 'GET');
        }

        function mostrar_TarifasDePuesto(tarifas) {
            console.log("Mostrando tarifas: ", tarifas);
            document.getElementById("DespuesDeCargar").hidden = false;
            document.getElementById("tarifasTable").innerHTML = crearTablaDesdeJson(tarifas);
        }

        function mostrar_EmularTransito(respuesta) {
            console.log("Mostrando resultado de emular tránsito: ", respuesta);
            document.getElementById("resultado").innerText = respuesta;
        }

        async function procesarRespuestaSubmit(respuesta){
            console.log("Respuesta del submit: ", respuesta);
            await mostrarMensaje(respuesta);
        }

        async function mostrar_error(respuesta) {
            await mostrarMensaje(respuesta);
        }


    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
